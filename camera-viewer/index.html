<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RE-covery · 相机观察台</title>
<style> *{box-sizing:border-box}body{margin:0;background:#0b1119;color:#e8eef7;font:16px system-ui}main{max-width:1200px;margin:auto;padding:40px 24px}header{display:flex;justify-content:space-between;align-items:center}small{color:#64dbc4;letter-spacing:3px}h1{font-size:30px;margin:12px 0 28px}.status{color:#f4c36b}section{background:#111d2b;border:1px solid #2a394b;border-radius:16px;padding:20px}.screen{height:min(62vh,680px);display:grid;place-items:center;background:#05090f;margin-bottom:20px;position:relative;overflow:hidden;border-radius:10px}.screen img{width:100%;height:100%;object-fit:contain;position:absolute}.screen p{color:#8a9aaf;text-align:center;line-height:2}input,select,button{font:inherit;border:1px solid #34475c;border-radius:8px;padding:12px;background:#142235;color:white}input{flex:1;min-width:180px}button{cursor:pointer}button.primary{background:#71e3cb;color:#09271e;border:0}form{display:flex;gap:10px;flex-wrap:wrap}footer{color:#8a9aaf;line-height:1.8;margin-top:18px;font-size:14px}[hidden]{display:none!important}</style>
<main><header><div><small>RE-COVERY / VISION</small><h1>相机观察台</h1></div><span class="status" id="status" role="status">● 等待接入</span></header><section><div class="screen" id="screen"><p id="empty">等待机器人相机<br>请填入现场技术人员提供的画面地址</p><img id="video" alt="机器人相机画面" hidden></div><form id="form"><input id="url" aria-label="画面地址" type="url" value="ws://127.0.0.1:8781" placeholder="http://机器人IP:8780/frame.jpg" required><select id="mode" aria-label="画面类型"><option value="ws">WebSocket 实时图像</option><option value="jpeg">连续 JPEG</option><option value="mjpeg">MJPEG 视频流</option></select><button class="primary">连接画面</button><button type="button" id="pause">停止</button><button type="button" id="full">全屏</button></form></section><footer id="info">头部左相机 · 仅查看画面<br>单张截图不会自行变成视频，需先启动持续采集服务。</footer></main>
<script>
const $=id=>document.getElementById(id);let generation=0,timer,watchdog,socket,blobURL,lastFrame=0;
function halt(){generation++;if(socket){socket.onclose=null;socket.close();socket=null;}if(blobURL){URL.revokeObjectURL(blobURL);blobURL=null;}clearTimeout(timer);clearTimeout(watchdog);$('video').onload=null;$('video').onerror=null;$('video').removeAttribute('src');$('video').hidden=true;$('empty').hidden=false;}
$('pause').onclick=()=>{halt();$('status').textContent='● 已停止';};
$('full').onclick=()=>{$('screen').requestFullscreen?.().catch(()=>{});};
$('form').onsubmit=e=>{e.preventDefault();halt();let address;try{address=new URL($('url').value);if(!['http:','https:','ws:','wss:'].includes(address.protocol))throw Error();}catch{$('status').textContent='请输入 HTTP 画面地址';return;}if($('mode').value==='ws'){const run=generation;function connect(){if(run!==generation)return;$('status').textContent='● 正在连接相机';socket=new WebSocket(address);socket.binaryType='blob';lastFrame=Date.now();socket.onmessage=async e=>{if(run!==generation)return;if(!(e.data instanceof Blob))return;lastFrame=Date.now();const u=URL.createObjectURL(e.data);const img=$('video');img.onload=()=>{if(blobURL)URL.revokeObjectURL(blobURL);blobURL=u;};img.src=u;img.hidden=false;$('empty').hidden=true;$('status').textContent='● 实时画面';$('info').textContent='头部左相机 · WebSocket · 最近接收 '+new Date().toLocaleTimeString();};socket.onclose=()=>{if(run!==generation)return;$('status').textContent='● 连接断开 · 正在重连';$('video').hidden=true;$('empty').hidden=false;timer=setTimeout(connect,2000);};socket.onerror=()=>socket.close();}function check(){if(run!==generation)return;if(Date.now()-lastFrame>4000){$('status').textContent='● 等待相机数据';$('video').hidden=true;$('empty').hidden=false;}watchdog=setTimeout(check,1000);}connect();check();return;}const run=generation,stream=$('mode').value==='mjpeg';$('status').textContent=stream?'● 正在请求视频流（帧活性未验证）':'● 正在连接';
function next(){if(run!==generation)return;const img=$('video');const u=new URL(address);u.searchParams.set('_t',Date.now());img.onload=()=>{if(run!==generation)return;clearTimeout(watchdog);img.hidden=false;$('empty').hidden=true;$('status').textContent=stream?'● 视频流已加载（帧活性未验证）':'● 已收到画面';$('info').textContent='最近加载：'+new Date().toLocaleTimeString()+' · '+img.naturalWidth+' × '+img.naturalHeight+' · '+(stream?'MJPEG':'每秒最多 10 次请求；采集是否更新以服务端为准');if(!stream)timer=setTimeout(next,100);};img.onerror=()=>{if(run!==generation)return;clearTimeout(watchdog);img.hidden=true;$('empty').hidden=false;$('status').textContent='● 暂无画面 · 2 秒后重连';timer=setTimeout(next,2000);};img.src=u.href;if(!stream)watchdog=setTimeout(()=>{img.onerror?.();img.removeAttribute('src');},5000);}
next();};
if(location.hostname!=='127.0.0.1'&&location.hostname!=='localhost')$('url').value=location.origin+'/frame.jpg';
</script></html>
